<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Cursor Lab — Project Nidos</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #050505; overflow: hidden; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
        .panel {
            position: fixed; top: 1.25rem; left: 1.25rem; z-index: 2;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; letter-spacing: 0.08em; color: #71717a;
            background: rgba(5,5,5,0.82); border: 1px solid rgba(255,255,255,0.09);
            padding: 1rem; width: 340px; user-select: none;
        }
        .panel h1 { font-size: 11px; font-weight: 600; color: #ff5f1f; letter-spacing: 0.2em; margin-bottom: 0.9rem; }
        .panel button {
            display: block; width: 100%; text-align: left; cursor: pointer;
            font: inherit; color: #a1a1aa; background: none; border: 0;
            border-top: 1px solid rgba(255,255,255,0.07); padding: 0.55rem 0.25rem;
        }
        .panel button:hover { color: #f4f4f5; }
        .panel button.on { color: #ff5f1f; }
        .panel button .k { color: #52525b; margin-right: 0.6rem; }
        .blurb { border-top: 1px solid rgba(255,255,255,0.07); padding-top: 0.75rem; margin-top: 0.2rem; line-height: 1.6; min-height: 3.6em; color: #a1a1aa; }
        .hint { margin-top: 0.75rem; color: #52525b; }
        .ghost-copy {
            position: fixed; right: 6vw; top: 50%; transform: translateY(-50%); z-index: 1;
            max-width: 34ch; pointer-events: none;
            font-family: Outfit, Inter, sans-serif; color: #f4f4f5;
        }
        .ghost-copy h2 { font-size: 2.6rem; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 1rem; }
        .ghost-copy p { font-family: Inter, sans-serif; font-size: 0.95rem; line-height: 1.65; color: #a1a1aa; }
    </style>
</head>
<body>
    <canvas id="net"></canvas>

    <!-- Sample copy: judge whether the effect distracts from reading -->
    <div class="ghost-copy" aria-hidden="true">
        <h2>Uzņēmumu digitalizācija.</h2>
        <p>Šis teksts ir šeit, lai redzētu, vai efekts traucē lasīt saturu, kas atrodas virs tīkla. Labs efekts paliek fonā.</p>
    </div>

    <div class="panel">
        <h1>■ CURSOR LAB</h1>
        <div id="btns"></div>
        <p class="blurb" id="blurb"></p>
        <p class="hint">taustiņi 1–9 0 q w e · klikšķis = tests</p>
    </div>

    <script>
    (function () {
        'use strict';
        var canvas = document.getElementById('net');
        var ctx = canvas.getContext('2d');

        // ===== base sim — mirror of the production hero-net module =====
        var DENSITY = 3800, LINK_DIST = 190, NODE_ALPHA = 0.7, LINE_ALPHA = 0.26;
        var SPEED = 0.3, NODE_R = 2.1, MAX_NODES = 220;
        var W = 0, H = 0, nodes = [], t = 0;
        var mouse = { x: -9999, y: -9999 };

        var seed = 1234567;
        function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

        function resize() {
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = canvas.clientWidth; H = canvas.clientHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            var target = Math.min(MAX_NODES, Math.round(W * H / DENSITY));
            while (nodes.length < target) nodes.push({
                x: rand() * W, y: rand() * H,
                vx: (rand() - 0.5) * SPEED * 2, vy: (rand() - 0.5) * SPEED * 2
            });
            nodes.length = target;
        }

        // A finite multiplier or 1 — never let a bad hook return poison the canvas
        function mul(v) { return (typeof v === 'number' && isFinite(v)) ? (v < 0 ? 0 : v) : 1; }

        function drawBase() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, W, H);
            var i, j, a, b, dx, dy, d2, d, al, m;
            // Effects may extend the link reach (constellation-style), so the cull
            // distance is asked for rather than assumed.
            var reach = LINK_DIST;
            if (current && current.linkReach) reach = mul(current.linkReach(S)) * LINK_DIST;
            var fLink = current && current.linkAlpha;
            var fA = current && current.nodeAlpha;
            var fR = current && current.nodeRadius;
            ctx.lineWidth = 1;
            for (i = 0; i < nodes.length; i++) {
                a = nodes[i];
                for (j = i + 1; j < nodes.length; j++) {
                    b = nodes[j];
                    dx = a.x - b.x; dy = a.y - b.y;
                    d2 = dx * dx + dy * dy;
                    if (d2 > reach * reach) continue;
                    d = Math.sqrt(d2);
                    al = (1 - Math.min(d / LINK_DIST, 1)) * LINE_ALPHA;
                    if (fLink) al *= mul(current.linkAlpha(a, b, d, S));
                    if (al <= 0.001) continue;
                    ctx.strokeStyle = 'rgba(255, 120, 60, ' + al.toFixed(3) + ')';
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
            }
            for (i = 0; i < nodes.length; i++) {
                a = nodes[i];
                al = NODE_ALPHA;
                if (fA) al *= mul(current.nodeAlpha(a, S));
                if (al <= 0.001) continue;
                m = NODE_R;
                if (fR) m *= mul(current.nodeRadius(a, S));
                if (m <= 0.01) continue;
                ctx.fillStyle = 'rgba(255, 140, 90, ' + al.toFixed(3) + ')';
                ctx.beginPath(); ctx.arc(a.x, a.y, m, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ===== effect slot (declared before drawBase reads it) =====
        var S = { nodes: nodes, mouse: mouse, W: 0, H: 0, t: 0, LINK_DIST: LINK_DIST, rand: rand, store: {} };
        var current = null;

        function setEffect(fx) {
            current = fx;
            S.store = {};
            if (fx && fx.init) fx.init(S);
            document.getElementById('blurb').textContent = fx ? fx.blurb : '';
            var i, kids = document.getElementById('btns').children;
            for (i = 0; i < kids.length; i++) kids[i].className = (EFFECTS[i] === fx) ? 'on' : '';
        }

        function tick() {
            var i, n, dx, dy, d2, d, f;
            S.nodes = nodes; S.W = W; S.H = H; S.t = ++t;
            for (i = 0; i < nodes.length; i++) {
                n = nodes[i];
                n.x += n.vx; n.y += n.vy;
                // production repulsion — kept in every variant
                dx = n.x - mouse.x; dy = n.y - mouse.y;
                d2 = dx * dx + dy * dy;
                if (d2 < 22500) {
                    d = Math.sqrt(d2) || 1;
                    f = (150 - d) / 150 * 0.35;
                    n.x += (dx / d) * f; n.y += (dy / d) * f;
                }
                if (current && current.force) current.force(n, S);
                if (n.x < -20) n.x = W + 20; else if (n.x > W + 20) n.x = -20;
                if (n.y < -20) n.y = H + 20; else if (n.y > H + 20) n.y = -20;
            }
            drawBase();
            if (current && current.frame) current.frame(ctx, S);
            requestAnimationFrame(tick);
        }

        // ===== variants — populated by the design panel =====
        var EFFECTS = [
            { key: 'none', name: 'Bez efekta (tikai repulsija)', blurb: 'Pašreizējais stāvoklis: tīkls tikai maigi atkāpjas no kursora.' }
,
            {
              key: 'spotlight',
              name: 'Torchlight',
              blurb: 'The pointer carries a quiet pool of warm light: the lines and points that were already there simply brighten and warm as it passes, then settle back once it moves on.',
            
              init: function (S) {
                var st = S.store;
                st.a = 0;        // eased light intensity, 0..1
                st.lx = 0;       // smoothed light position - the pool glides after the cursor
                st.ly = 0;
                st.on = false;   // true while lx/ly hold a valid position
                st.pulse = 0;    // click bloom, decays each frame
                st.lit = [];     // reusable scratch arrays -> zero per-frame allocation
                st.litD = [];
              },
            
              frame: function (ctx, S) {
                var st = S.store;
                var mx = S.mouse.x, my = S.mouse.y;
                var pointerOn = mx > -9000;
            
                // ---- temporal easing ------------------------------------------------
                // 0.15/frame exponential smoothing reaches ~95% of target in ~18 frames,
                // i.e. ~300ms at 60fps. The SAME constant drives intensity and position,
                // so the light brightens, glides and dies on one timescale - it reads as
                // light with inertia, not a mask snapped to the cursor.
                var EASE = 0.15;
                st.a += ((pointerOn ? 1 : 0) - st.a) * EASE;
                if (st.a < 0.01) { st.on = false; return; }  // fully faded: do no work at all
            
                if (pointerOn) {
                  if (!st.on) {
                    // snap on (re)entry: never lerp in from the -9999 sentinel,
                    // or the pool would streak across the whole canvas
                    st.lx = mx; st.ly = my; st.on = true;
                  } else {
                    st.lx += (mx - st.lx) * EASE;
                    st.ly += (my - st.ly) * EASE;
                  }
                }
                // when the pointer leaves, the pool stays where it was and fades in place
            
                // click bloom: the torch breathes once - same boost, briefly stronger.
                // No new geometry, so it stays inside the "light source" metaphor.
                st.pulse *= 0.86;                        // ~250ms perceptual decay at 60fps
                var boost = st.a * (1 + 0.35 * st.pulse);
                if (boost > 1.15) boost = 1.15;          // hard cap protects every alpha below
            
                // ---- geometry constants ---------------------------------------------
                // R 240: wide enough that the effect is unmissable on a 27in panel,
                // narrow enough that copy sitting ~300px from the cursor is untouched.
                var R = 240;
                // A link's midpoint can only be inside the pool if both endpoints are
                // within R + LINK_DIST/2 of the light - that is the gather radius.
                var GATHER = R + S.LINK_DIST * 0.5;
                var G2 = GATHER * GATHER;
                var LD2 = S.LINK_DIST * S.LINK_DIST;
            
                // ---- gather pass: O(nodes) ------------------------------------------
                var lit = st.lit, litD = st.litD;
                lit.length = 0; litD.length = 0;
                // CAP 48 is a safety valve: at this sim's density (~1 node per 3800px^2)
                // a GATHER disc holds ~20 nodes, so the cap never bites in practice -
                // it just bounds the pair pass below at ~1.1k segments worst case,
                // keeping per-frame cost constant no matter the node count.
                var CAP = 48;
                var i, n, dx, dy, d2;
                for (i = 0; i < S.nodes.length && lit.length < CAP; i++) {
                  n = S.nodes[i];
                  dx = n.x - st.lx; dy = n.y - st.ly;
                  d2 = dx * dx + dy * dy;
                  if (d2 < G2) { lit.push(n); litD.push(Math.sqrt(d2)); }
                }
            
                // ---- relight links (pairs within the small lit set only) ------------
                // Re-strokes links the base pass ALREADY drew - nothing new appears.
                // Base links are rgba(255,138,68, <=0.26); the boost hue 255,150,88 is
                // a half-step toward amber ("warm light on embers"), and the 0.30 cap
                // keeps combined link alpha under ~0.5 so copy above stays readable.
                var j, b, d, t, w, mpx, mpy, alpha;
                ctx.lineWidth = 1;  // never thicken: brightness only, or lines become objects
                for (i = 0; i < lit.length; i++) {
                  for (j = i + 1; j < lit.length; j++) {
                    n = lit[i]; b = lit[j];
                    dx = n.x - b.x; dy = n.y - b.y;
                    d2 = dx * dx + dy * dy;
                    if (d2 >= LD2) continue;               // not a link the base drew
                    d = Math.sqrt(d2);
                    // light falloff sampled at the link midpoint, smoothstep to 0 at R
                    mpx = (n.x + b.x) * 0.5 - st.lx;
                    mpy = (n.y + b.y) * 0.5 - st.ly;
                    t = Math.sqrt(mpx * mpx + mpy * mpy) / R;
                    if (t >= 1) continue;
                    w = 1 - t * t * (3 - 2 * t);           // smoothstep: no visible edge
                    alpha = (1 - d / S.LINK_DIST) * w * boost * 0.30;
                    if (alpha < 0.012) continue;           // skip invisible strokes
                    ctx.strokeStyle = 'rgba(255, 150, 88, ' + alpha.toFixed(3) + ')';
                    ctx.beginPath();
                    ctx.moveTo(n.x, n.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                  }
                }
            
                // ---- relight nodes ---------------------------------------------------
                for (i = 0; i < lit.length; i++) {
                  t = litD[i] / R;
                  if (t >= 1) continue;                    // gathered for links only
                  w = (1 - t * t * (3 - 2 * t)) * boost;   // smoothstep * eased intensity
                  if (w < 0.03) continue;
                  n = lit[i];
                  // swell "a fraction": 2.1px -> max ~2.7px. Noticeable at arm's length
                  // on a 27in panel, but never enough to read as a spawned particle.
                  var r = 2.1 * (1 + 0.30 * w);
                  // base disc is 0.7 alpha; lift toward - never to - opaque
                  // (max 0.7 + 0.25*1.15 = 0.9875 even during a click bloom)
                  ctx.fillStyle = 'rgba(255, 158, 104, ' + (0.7 + 0.25 * w).toFixed(3) + ')';
                  ctx.beginPath();
                  ctx.arc(n.x, n.y, r, 0, 6.2832);
                  ctx.fill();
                  // faint warm-white glint at the core sells "catching the light";
                  // 0.14 * 1.15 = 0.161 max - safely under the 0.2 white ceiling
                  if (w > 0.25) {
                    ctx.fillStyle = 'rgba(255, 244, 235, ' + (0.14 * w).toFixed(3) + ')';
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, r * 0.42, 0, 6.2832);
                    ctx.fill();
                  }
                }
              },
            
              onClick: function (S) {
                // one soft breath of the same light - decays inside frame()
                S.store.pulse = 1;
              }
            }
            ,
            {
              key: 'embers',
              name: 'Ember Trail',
              blurb: 'Moving your pointer sheds a few tiny warm sparks that drift, rise, and fade in about a second - a brief heat signature of where you have been, and nothing when you rest.',
            
              init: function (S) {
                S.store.pool = [];      // live embers, hard-capped; swap-pop removal keeps this allocation-quiet
                S.store.carry = 0;      // fractional spawn accumulator: lets shed rate go below 1 ember/frame
                S.store.px = 0;
                S.store.py = 0;
                S.store.hasPrev = false; // false until one on-canvas frame is seen; prevents an entry spray
              },
            
              frame: function (ctx, S) {
                var st = S.store;
                var pool = st.pool;
                var TAU = Math.PI * 2;
            
                // ---- tuning ----
                var MAX = 90;         // pool cap: covers a full-screen sweep, and 90 tiny arcs is negligible per frame
                var DEAD_ZONE = 1.6;  // px/frame below which nothing sheds: a resting hand micro-jitters ~1px, and "still sheds nothing" is the contract
                var PER_PX = 0.10;    // embers per px travelled: ~3/frame at a brisk 30px/frame sweep - a whisper, not fireworks
                var BURST_CAP = 4;    // per-frame spawn ceiling so one violent flick cannot dump the pool in a single clump
                var TELEPORT = 200;   // px/frame above this is a re-entry or tab-switch jump, not a gesture - record, do not shed
                var INHERIT = 0.16;   // fraction of pointer velocity an ember keeps: enough to read as "shed by movement", not "launched"
                var SPREAD = 0.5;     // random velocity noise (px/frame): keeps a straight drag from leaving a machine-perfect line
                var DRAG = 0.94;      // per-frame damping: lateral motion dies within ~15 frames, after which buoyancy owns the ember
                var LIFT = 0.016;     // upward bias per frame: heat rises, but slowly - reads as ember, not bubble
                var PEAK_A = 0.55;    // birth alpha on a sub-node-size dot: visible on a 27" display, never competes with copy
            
                var mx = S.mouse.x, my = S.mouse.y;
                var onCanvas = mx > -9000; // mouse.x is -9999 off-canvas
            
                // ---- shed ----
                if (onCanvas && st.hasPrev) {
                  var dx = mx - st.px, dy = my - st.py;
                  var speed = Math.sqrt(dx * dx + dy * dy);
                  if (speed > TELEPORT) {
                    // pointer jumped (re-entered canvas, window refocus): treat as a fresh start, no spray
                    st.carry = 0;
                  } else if (speed > DEAD_ZONE) {
                    st.carry += speed * PER_PX;
                    var want = Math.floor(st.carry);
                    if (want > BURST_CAP) want = BURST_CAP;
                    st.carry -= want;
                    if (st.carry > 2) st.carry = 2; // never bank more than a moment's worth of embers during cap-outs
                    for (var s = 0; s < want && pool.length < MAX; s++) {
                      // spawn along this frame's travel segment: fast sweeps leave a continuous wake, not per-frame clumps
                      var u = S.rand();
                      pool.push({
                        x: st.px + dx * u + (S.rand() - 0.5) * 3, // +-1.5px jitter: embers scatter off the path, not on a rail
                        y: st.py + dy * u + (S.rand() - 0.5) * 3,
                        vx: dx * INHERIT + (S.rand() - 0.5) * SPREAD,
                        vy: dy * INHERIT + (S.rand() - 0.5) * SPREAD,
                        life: 0,
                        max: 36 + Math.floor(S.rand() * 37),      // 36-72 frames = 0.6-1.2s at 60fps: long enough to register, short enough to stay "brief"
                        r: 1 + S.rand() * 0.5,                    // 1-1.5px: deliberately smaller than the 2.1px network nodes, so embers stay subordinate
                        g: 110 + Math.floor(S.rand() * 50),       // per-ember green channel 110-160: warm hue jitter, all inside the site's orange family
                        ph: S.rand() * TAU                        // flicker phase offset so the pool never pulses in unison
                      });
                    }
                  } else {
                    st.carry = 0; // a still pointer sheds nothing - and banks nothing for later
                  }
                }
                if (onCanvas) { st.px = mx; st.py = my; st.hasPrev = true; }
                else { st.hasPrev = false; } // off-canvas: stop shedding; live embers below simply finish dying, so the effect fades gracefully
            
                // ---- update + draw, single O(pool) pass with swap-pop removal ----
                var i = 0, e, t, a, flick;
                while (i < pool.length) {
                  e = pool[i];
                  e.life++;
                  if (e.life >= e.max) {
                    pool[i] = pool[pool.length - 1];
                    pool.pop();
                    continue; // re-check the swapped-in ember at this index
                  }
                  e.vx *= DRAG;
                  e.vy = e.vy * DRAG - LIFT;
                  e.x += e.vx;
                  e.y += e.vy;
            
                  t = 1 - e.life / e.max; // 1 at birth -> 0 at death
                  // +-15% shimmer at ~3Hz: enough to feel alive on 1.5px dots, far too small and slow to strobe
                  flick = 0.85 + 0.15 * Math.sin(S.t * 0.3 + e.ph);
                  // t^2 decay: brightness collapses early, so the trail reads as cooling heat rather than lingering paint
                  a = PEAK_A * t * t * flick;
            
                  ctx.fillStyle = 'rgba(255,' + e.g + ',60,' + a.toFixed(3) + ')';
                  ctx.beginPath();
                  ctx.arc(e.x, e.y, e.r * (0.6 + 0.4 * t), 0, TAU); // shrinks to 60% as it cools
                  ctx.fill();
            
                  // white-hot core only in the first quarter of life, capped at 0.18 alpha - under the 0.2 white ceiling
                  if (t > 0.75) {
                    ctx.fillStyle = 'rgba(255,255,255,' + (0.18 * (t - 0.75) * 4).toFixed(3) + ')';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.r * 0.5, 0, TAU);
                    ctx.fill();
                  }
                  i++;
                }
              },
            
              onClick: function (S) {
                // a click taps the surface: a soft puff of six slow embers - no ring, no flash, no HUD
                var st = S.store;
                if (!st.pool || S.mouse.x < -9000) return;
                var TAU = Math.PI * 2;
                for (var k = 0; k < 6 && st.pool.length < 90; k++) {
                  var ang = S.rand() * TAU;
                  var sp = 0.3 + S.rand() * 0.6; // slower than movement-shed embers: a settle, not a burst
                  st.pool.push({
                    x: S.mouse.x + (S.rand() - 0.5) * 4,
                    y: S.mouse.y + (S.rand() - 0.5) * 4,
                    vx: Math.cos(ang) * sp,
                    vy: Math.sin(ang) * sp,
                    life: 0,
                    max: 48 + Math.floor(S.rand() * 25), // 0.8-1.2s: click embers linger at the top of the normal range
                    r: 1 + S.rand() * 0.5,
                    g: 110 + Math.floor(S.rand() * 50),
                    ph: S.rand() * TAU
                  });
                }
              }
            }
            ,
            {
                key: 'charge',
                name: 'Charge & Relay',
                blurb: 'Rest the pointer and the nearest node slowly wakes, then hands one soft pulse to its neighbours - the network passes your presence along instead of pointing at you.',
            
                init: function (S) {
                    S.store.target = -1;   // index of the node currently charging; -1 = none
                    S.store.charge = 0;    // 0..1 charge level of the target
                    S.store.pulse = null;  // in-flight relay event, or null (one at a time)
                    S.store.rest = 0;      // cooldown frames after an event completes
                    S.store.flashes = [];  // arrival afterglows; live independently of the pulse
                },
            
                force: function (n, S) {
                    var st = S.store;
                    // Steady the charging node: cancel a slice of THIS frame's drift step so the
                    // brightening dot holds still enough to read as deliberate. We subtract from
                    // position (force runs pre-integration), never from vx/vy, so no damping
                    // accumulates and the node resumes full drift the instant charge drops.
                    // 0.55 max still leaves visible motion - a fully frozen node reads as
                    // pinned/targeted, which is exactly the rejected direction.
                    if (st.target >= 0 && st.charge > 0 && S.nodes[st.target] === n) {
                        var hold = 0.55 * st.charge;
                        n.x -= n.vx * hold;
                        n.y -= n.vy * hold;
                    }
                },
            
                frame: function (ctx, S) {
                    var st = S.store, nodes = S.nodes;
                    var i, j, m, n, dx, dy, d2, c, g;
            
                    // ---- Tuning (frame counts assume ~60fps, same as the base sim) ----------
                    var RANGE = 180;           // pickup radius: just under LINK_DIST so charge and relay share one visual scale
                    var CHARGE_FRAMES = 48;    // ~0.8s dwell to full charge: slow enough that scrubbing the page never fires it
                    var DECAY_MULT = 2.6;      // drains ~2.6x faster than it builds - glow lingering on an abandoned node looks broken
                    var BLINK_FRAMES = 10;     // origin release blink: a breath, not a flash
                    var HOP_FRAMES = 22;       // ~0.37s per hop: slow enough to follow, fast enough to feel like signal not animation
                    var REST_FRAMES = 70;      // ~1.2s of quiet after each event: a resting cursor gives a calm heartbeat, never a strobe
                    var MAX_H1 = 5;            // hop-1 breadth cap: enough to read as "spreading"...
                    var MAX_H2 = 8;            // hop-2 cap: ...few enough to stay quiet
                    var FLASH_FRAMES = 16;     // arrival afterglow length
                    var NODE_R = 2.1;          // base node radius (matches the network)
                    var FULL_R = 3.5;          // fully charged radius per spec
            
                    function smooth(q) { return q <= 0 ? 0 : q >= 1 ? 1 : q * q * (3 - 2 * q); }
                    // rgba() rejects exponent notation ("1e-4"), so every alpha goes through this:
                    function a(v) { return v.toFixed(3); }
            
                    if (!st.flashes) st.flashes = []; // defensive if frame ever runs before init
            
                    // ---- Guards against reseed (resize rebuilds the node array) -------------
                    if (st.target >= nodes.length) { st.target = -1; st.charge = 0; }
                    if (st.pulse && st.pulse.origin >= nodes.length) {
                        st.pulse = null; st.flashes.length = 0; st.rest = REST_FRAMES;
                    }

                // Measured, ~6 of the ~50 fully-weighted nodes are interstitial at any
                // moment: the pocket reads as an ordered lattice with a few points still
                // loose in it, not as a perfect stamp.
                var vx, vy;
                if (w > st.CLAIM_W) {
                  if (st.claim(st, ai, aj)) { vx = ax; vy = ay; }
                  else if (st.claim(st, bi, bj)) { vx = bx; vy = by; }
                  else return;
                } else { vx = ax; vy = ay; }
            
                var tx = vx * st.CA - vy * st.SA + st.ox[i];   // back to world, plus this
                var ty = vx * st.SA + vy * st.CA + st.oy[i];   // node's permanent offset
            
                // ---- ease onto it (position only; vx/vy are never touched) ------------
                var pull = st.SNAP * w * w;
                var sx = (tx - n.x) * pull, sy = (ty - n.y) * pull;
                var s2 = sx * sx + sy * sy;
                if (s2 > st.MAXSTEP2) { var kk = st.MAXSTEP / Math.sqrt(s2); sx *= kk; sy *= kk; }
                n.x += sx; n.y += sy;
              },
            
              // The three draw hooks are pure arithmetic on the latched pointer distance
              // and the global envelope - no allocation, no per-node lookup, no assumption
              // about the order the base draw loop visits things in. Each opens with a
              // negated test on env, so an uninitialised or NaN store returns a clean 1
              // rather than propagating NaN into the canvas.
            
              nodeAlpha: function (n, S) {
                var st = S.store, e = st.env;
                if (!(e >= 0.01)) return 1;
                var dx = n.x - st.mx, dy = n.y - st.my;
                var d2 = dx * dx + dy * dy;
                if (d2 > st.VIS2) return 1;
                var f = 1 - Math.sqrt(d2) / st.VIS;
                f = f * f * (3 - 2 * f);        // smoothstep: zero slope at the rim, so the
                                                // ordered region has no visible edge
                return 1 + f * e * 0.12;        // 0.70 -> 0.78 at dead centre: settled, not lit
              },
            
              nodeRadius: function (n, S) {
                var st = S.store, e = st.env;
                if (!(e >= 0.01)) return 1;
                var dx = n.x - st.mx, dy = n.y - st.my;
                var d2 = dx * dx + dy * dy;
                if (d2 > st.VIS2) return 1;
                var f = 1 - Math.sqrt(d2) / st.VIS;
                f = f * f * (3 - 2 * f);
                return 1 + f * e * 0.08;        // 2.10px -> 2.27px. Any more and the lattice
                                                // starts to glow rather than to be geometric
              },
            
              linkAlpha: function (a, b, d, S) {
                var st = S.store, e = st.env;
                if (!(e >= 0.01)) return 1;
                var ax = a.x - st.mx, ay = a.y - st.my;
                var bx = b.x - st.mx, by = b.y - st.my;
                var da2 = ax * ax + ay * ay, db2 = bx * bx + by * by;
                if (da2 > st.VIS2 && db2 > st.VIS2) return 1;   // untouched: most of the page
                var fa = 0, fb = 0;
                if (da2 < st.VIS2) { fa = 1 - Math.sqrt(da2) / st.VIS; fa = fa * fa * (3 - 2 * fa); }
                if (db2 < st.VIS2) { fb = 1 - Math.sqrt(db2) / st.VIS; fb = fb * fb * (3 - 2 * fb); }
                var both = fa * fb;                  // 1 = both ends deep in the ordered patch
                var edge = fa + fb - 2 * both;       // 1 = exactly one end inside: a link
                                                     //     crossing out into the chaos
                // Bond-ness: 1 at exactly one pitch, 0 beyond +-42% of it. Those are the
                // crystal's actual nearest-neighbour bonds - the hexagon edges. Quantised
                // positions alone are not enough to read at this density; the network has
                // ~12 links per node and the long incidental ones bury the short ones.
                var q = Math.abs(d - st.PITCH) / (0.42 * st.PITCH);
                if (q > 1) q = 1;
                // So: bonds up to +60%, other links inside the patch -35%, links crossing
                // the boundary -30%. This REDISTRIBUTES ink rather than adding it - measured
                // over the pocket the total falls 2.8% - so the ordered region ends up
                // slightly quieter than the plain network while being far more legible.
                // Since both + edge <= 1, the multiplier is bounded to [0.65, 1.60]: it can
                // never invert a link or blank one out. A bond at one pitch peaks at 0.231
                // alpha on a 1440x900 laptop and at 0.251 in the worst viewport measured
                // (1280x720), both under the 0.259 of the brightest ordinary link elsewhere
                // on the page: nothing here can out-shout body copy.
                return 1 + e * (both * (0.95 * (1 - q) - 0.35) - edge * 0.30);
              }
            }
            ,
            {
              key: 'recruit',
              name: 'Constellation',
              blurb: 'The handful of nodes nearest your cursor recognise each other and knit into a small dense constellation, joined by hairlines that reach far past the usual range of the network, then unravel again behind you as you move on.',
            
              // ---- Tuning -------------------------------------------------------------
              // Everything below is set against the base sim: LINK_DIST 190, node spacing
              // ~97px at production density (1920x1080 over 220 nodes = 9.4k px2 each), base
              // link alpha ceiling 0.26, base node alpha 0.7 at r 2.1px.
              //
              // K       6    set size. Also roughly the number of nodes that sit within ~140px
              //              of the pointer at production density, i.e. exactly the nodes the
              //              eye already reads as "near the cursor" - so the effect never has
              //              to reach for a stranger to fill the quota.
              // CAP     16   membership slots = 6 live + 10 still fading out. A node that drops
              //              out KEEPS its slot until its weight reaches zero, which is the
              //              whole mechanism for "dissolves" rather than "pops". At OUT 0.90 a
              //              departed member needs ~52 frames to reach EPS, so the spare slots
              //              have to cover roughly (churn rate x 52) - 10 spares clear that at
              //              any pointer speed a reader actually produces. The extra slots are
              //              free visually: every one of them is a decaying member whose links
              //              carry wa*wb, so they add strokes but no measurable ink.
              // TAKE  0.06   a slot may only be repossessed once its weight has fallen this far.
              //              Without it, a fast reposition finds every slot held at full weight
              //              and the recycler cuts a LIT member: measured worst case was a
              //              hairline stepping 0.28 -> 0 in one frame, which is the single
              //              loudest thing this effect could do on a page of body copy. With the
              //              guard the worst discard is 0.06, so the step is <= 0.06 x 0.30 =
              //              0.018 alpha, below the effect's own dissolve rate. When no slot is
              //              faint enough the newcomer simply waits a few frames; the set trails
              //              the pointer instead of snapping, which is the stated intent anyway.
              // RECRUIT_R 300 eligibility ceiling, ~2.2x the typical 6th-nearest distance. In
              //              normal density it never binds; its job is the sparse patch, where
              //              an unbounded "6 nearest" would rope in a node half a screen away
              //              and read as one long arbitrary spoke instead of a cluster.
              // RIM     90   soft band just inside RECRUIT_R over which the target weight ramps
              //              0 -> 1, smoothstepped. A node that only qualifies because the patch
              //              is sparse joins faint instead of at full strength, and there is no
              //              visible circle where recruitment begins.
              // IN      0.12 knit rate: ~90% of full weight in 18 frames (~0.3s). Fast enough to
              //              feel attached to the pointer, slow enough that no hairline can ever
              //              appear inside a single frame.
              // OUT     0.90 dissolve rate: half-life 6.6 frames, invisible by ~0.9s. Deliberately
              //              about twice as slow as the knit, so the constellation trails and
              //              unravels behind the pointer instead of snapping off. Both endpoints
              //              decaying puts the steepest hairline step at 0.28 x (1-0.9^2) = 0.053
              //              alpha, and that is the loudest single element this effect produces.
              // INC     0.78 incumbency bonus, applied to the RANKING key only (0.78 on squared
              //              distance = 12% on distance). A node already in the set must be beaten
              //              by 12% before it is displaced - hysteresis that kills the rank chatter
              //              two near-equidistant nodes would otherwise show as flickering links.
              // SPAN    380  = 2 x LINK_DIST: the extended threshold, the point of the effect.
              //              Double range gives near-total connectivity inside a 6-node cluster
              //              whose diameter is typically ~300px, so the group visibly closes up;
              //              the 1 - d/SPAN falloff still leaves the longest edges faintest, so the
              //              shape stays legible instead of flattening into a solid mesh, and a
              //              link crossing the threshold does so at alpha ~0, never as a step.
              // LINK_A  0.30 peak alpha of a recruited hairline. Because its falloff reference is
              //              2x longer, a recruited link is ~2x its base self at the same distance,
              //              yet the ceiling sits only 15% over the base network's own maximum:
              //              denser, never hotter, and body copy on top stays readable. Base share
              //              and constellation share composite to at most 0.299 on any one link.
              // A_GAIN 0.28 / R_GAIN 0.45: recruited nodes go 0.7 -> 0.90 alpha and 2.1 -> 3.0px.
              //              Enough to read the six as chosen at a glance; alpha stays under 1 so
              //              the dot never washes toward white.
              // EPS   0.004  below ~1/255 of alpha nothing is on screen, so retiring a slot there
              //              is free and keeps the live count (the hot hooks' bail-out) honest.
              //
              // Nothing is ever drawn at the pointer: the pointer only decides membership.
            
              // Allocate the membership table once. All state lives in S.store.
              init: function (S) {
                var st = S.store, k;
                st.CAP = 16;
                st.node = new Array(st.CAP);   // node reference per slot, null = free
                st.ix = new Array(st.CAP);     // that node's index in S.nodes, for the staleness check
                st.wt = new Array(st.CAP);     // 0..1 membership weight per slot
                for (k = 0; k < st.CAP; k++) { st.node[k] = null; st.ix[k] = -1; st.wt[k] = 0; }
                st.live = 0;                   // slots with weight > 0; lets the hot hooks bail in one test
                st.ck = new Array(6);          // top-K ranking key (incumbency-biased)
                st.cd = new Array(6);          // top-K true squared distance to pointer
                st.cn = new Array(6);          // top-K node references
                st.ci = new Array(6);          // top-K indices into S.nodes
                st.n = -1;                     // node count last synced against (resize guard)
                st._t = -1;                    // frame stamp, so the sync runs once per frame
              },
            
              // force() is used purely as a once-per-frame hook that lands BEFORE the base
              // draw; it never touches n. The whole effect is one O(nodes) ranking pass plus a
              // fixed CAP-sized bookkeeping pass, both run on the frame's first call.
              force: function (n, S) {
                var st = S.store, q;
            
                // Defensive rebuild: covers a harness that skipped init(), and is the cheapest
                // safe place to notice a resize that reseeded the node array.
                if (!st.node) {
                  st.CAP = 16; st.node = new Array(16); st.ix = new Array(16); st.wt = new Array(16);
                  for (q = 0; q < 16; q++) { st.node[q] = null; st.ix[q] = -1; st.wt[q] = 0; }
                  st.live = 0;
                  st.ck = new Array(6); st.cd = new Array(6); st.cn = new Array(6); st.ci = new Array(6);
                  st.n = -1; st._t = -1;
                }
                if (st._t === S.t) return;     // already synced this frame; the other calls cost one compare
                st._t = S.t;
            
                var CAP = st.CAP, K = 6;
                var RECRUIT_R = 300, RIM = 90, IN = 0.12, OUT = 0.90, INC = 0.78, TAKE = 0.06, EPS = 0.004;
                var nodes = S.nodes, m = nodes.length;
                var i, j, k, p, nd, dx, dy, d2, key, slot, lo, tgt, dist;
            
                if (st.n !== m) {              // node array resized: drop every stale reference
                  st.n = m;
                  for (k = 0; k < CAP; k++) { st.node[k] = null; st.ix[k] = -1; st.wt[k] = 0; }
                  st.live = 0;
                }
                // A resize can also reseed the field WITHOUT changing its length, which leaves
                // the table holding node objects that are no longer simulated - they would sit
                // frozen at their last coordinates and go on drawing hairlines for the whole
                // ~52 frame fade. One identity check per slot per frame retires them at once.
                for (k = 0; k < CAP; k++) {
                  if (st.node[k] !== null && nodes[st.ix[k]] !== st.node[k]) {
                    st.node[k] = null; st.ix[k] = -1; st.wt[k] = 0;
                  }
                }
            
                // ---- 1. rank the K nearest nodes to the pointer -------------------------
                // Skipped entirely when the pointer is off canvas (-9999), which leaves every
                // slot unclaimed below, so the constellation dissolves on its own with no
                // special casing and never freezes mid-state.
                var nc = 0, mx = S.mouse.x, my = S.mouse.y;
                if (mx > -9000 && my > -9000) {
                  var R2 = RECRUIT_R * RECRUIT_R;
                  for (i = 0; i < m; i++) {
                    nd = nodes[i];
                    dx = nd.x - mx; dy = nd.y - my;
                    d2 = dx * dx + dy * dy;
                    if (!(d2 <= R2)) continue;           // negated compare: a NaN position is rejected here
                    key = d2;
                    for (k = 0; k < CAP; k++) {          // incumbency discount, ranking only
                      if (st.node[k] === nd && st.wt[k] > 0) { key = d2 * INC; break; }
                    }
                    if (nc < K) nc++;
                    else if (key >= st.ck[K - 1]) continue;
                    for (p = nc - 1; p > 0 && st.ck[p - 1] > key; p--) {
                      st.ck[p] = st.ck[p - 1]; st.cd[p] = st.cd[p - 1]; st.cn[p] = st.cn[p - 1]; st.ci[p] = st.ci[p - 1];
                    }
                    st.ck[p] = key; st.cd[p] = d2; st.cn[p] = nd; st.ci[p] = i;
                  }
                }
            
                // ---- 2. fold the candidates into the membership slots -------------------
                // A slot is a lease, not a lookup: holding one across frames is what makes a
                // joining node ramp up from zero and a leaving node ramp back down to zero.
                var mask = 0, live = 0;
                for (j = 0; j < nc; j++) {
                  nd = st.cn[j];
                  slot = -1;
                  for (k = 0; k < CAP; k++) { if (st.node[k] === nd) { slot = k; break; } }
                  if (slot < 0) { for (k = 0; k < CAP; k++) { if (st.node[k] === null) { slot = k; break; } } }
                  if (slot < 0) {                        // every slot leased: consider the faintest un-renewed one
                    lo = 2;
                    for (k = 0; k < CAP; k++) {
                      if (!(mask & (1 << k)) && st.wt[k] < lo) { lo = st.wt[k]; slot = k; }
                    }
                    if (slot < 0 || lo > TAKE) continue; // still visible: let it finish, this candidate waits
                    st.wt[slot] = 0;                     // newcomer starts from black - no pop on takeover
                  }
                  st.node[slot] = nd;
                  st.ix[slot] = st.ci[j];
                  mask |= (1 << slot);
                  dist = Math.sqrt(st.cd[j]);
                  tgt = (RECRUIT_R - dist) / RIM;
                  if (tgt > 1) tgt = 1; else if (tgt < 0) tgt = 0;
                  tgt = tgt * tgt * (3 - 2 * tgt);       // smoothstep: zero slope at the rim
                  st.wt[slot] += (tgt - st.wt[slot]) * IN;
                  if (st.wt[slot] > 0) live++;
                }
                for (k = 0; k < CAP; k++) {              // un-renewed leases decay, then release
                  if (mask & (1 << k)) continue;
                  if (st.wt[k] > 0) {
                    st.wt[k] *= OUT;
                    if (st.wt[k] < EPS) { st.wt[k] = 0; st.node[k] = null; st.ix[k] = -1; } else live++;
                  } else { st.node[k] = null; st.ix[k] = -1; }
                }
                st.live = live;
              },
            
              // Hot-loop hooks: one test bails out when nothing is recruited, otherwise a scan
              // of CAP slot references. Pure arithmetic and reference compares, no allocation.
              nodeAlpha: function (n, S) {
                var st = S.store, k;
                if (!st.live) return 1;
                for (k = 0; k < st.CAP; k++) { if (st.node[k] === n) return 1 + 0.28 * st.wt[k]; }
                return 1;
              },
            
              nodeRadius: function (n, S) {
                var st = S.store, k;
                if (!st.live) return 1;
                for (k = 0; k < st.CAP; k++) { if (st.node[k] === n) return 1 + 0.45 * st.wt[k]; }
                return 1;
              },
            
              // Member-to-member links are handed over to frame(), which redraws them on the
              // extended SPAN falloff. Both passes own the same pair, so the base share must be
              // exactly the complement of the constellation share (1 - wa*wb); otherwise a
              // half-recruited link gets stroked twice and visibly thickens mid-transition.
              linkAlpha: function (a, b, d, S) {
                var st = S.store, k, nd, wa = 0, wb = 0;
                if (!st.live) return 1;
                for (k = 0; k < st.CAP; k++) {
                  nd = st.node[k];
                  if (nd === a) wa = st.wt[k];
                  else if (nd === b) wb = st.wt[k];
                }
                if (wa === 0 || wb === 0) return 1;
                return 1 - wa * wb;
              },
            
              // The constellation itself: every member pair inside SPAN, at most CAP*(CAP-1)/2
              // hairlines regardless of node count, and in practice far fewer because the outer
              // loop drops a whole slot on one compare. Pairs longer than SPAN are dropped, which
              // also silently swallows the case where a member wraps around the edge of the
              // canvas - that jump is ~W px, far past SPAN, so no line shoots across screen.
              // save/restore because the host keeps drawing on this context after we return.
              frame: function (ctx, S) {
                var st = S.store;
                if (!st.live) return;
                var CAP = st.CAP, SPAN = 380, LINK_A = 0.30, EPS = 0.004;
                var i, j, a, b, wa, wb, dx, dy, d, al;
                ctx.save();
                ctx.lineWidth = 1;
                for (i = 0; i < CAP; i++) {
                  a = st.node[i]; if (!a) continue;
                  wa = st.wt[i]; if (wa < EPS) continue;
                  for (j = i + 1; j < CAP; j++) {
                    b = st.node[j]; if (!b) continue;
                    wb = st.wt[j]; if (wb < EPS) continue;
                    dx = a.x - b.x; dy = a.y - b.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (!(d < SPAN)) continue;           // negated compare: a NaN distance is rejected here
                    al = (1 - d / SPAN) * LINK_A * wa * wb;
                    if (al < EPS) continue;
                    ctx.strokeStyle = 'rgba(255, 132, 70, ' + al.toFixed(3) + ')';
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                  }
                }
                ctx.restore();
              }
            }
        ];

        var btns = document.getElementById('btns');
        EFFECTS.forEach(function (fx, i) {
            var b = document.createElement('button');
            b.innerHTML = '<span class="k">' + ('1234567890qwe'.charAt(i) || '-') + '</span>' + fx.name;
            b.addEventListener('click', function () { setEffect(fx); });
            btns.appendChild(b);
        });
        // 1-9, then 0 for the tenth, then q/w/e - more options than digits
        var KEYS = '1234567890qwe';
        document.addEventListener('keydown', function (e) {
            var i = KEYS.indexOf(e.key.toLowerCase());
            if (i >= 0 && EFFECTS[i]) setEffect(EFFECTS[i]);
        });

        canvas.addEventListener('pointermove', function (e) {
            var r = canvas.getBoundingClientRect();
            mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
        });
        canvas.addEventListener('pointerleave', function () { mouse.x = -9999; mouse.y = -9999; });
        canvas.addEventListener('pointerdown', function () { if (current && current.onClick) current.onClick(S); });
        window.addEventListener('resize', resize);

        resize();
        setEffect(EFFECTS[0]);
        requestAnimationFrame(tick);
    })();
    </script>
</body>
