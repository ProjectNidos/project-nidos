<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Nidos CRM</title>
    <link rel="stylesheet" href="crm.css">
</head>

<body style="display:flex; align-items:center; justify-content:center;">
    <div class="crm-shell" style="width:100%; max-width:400px; padding:40px;">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 class="crm-title" style="font-size:28px;">Welcome Back</h1>
            <div class="crm-subtitle">Sign in to access the CRM</div>
        </div>

        <form id="login-form">
            <div style="margin-bottom:16px;">
                <label class="crm-label" for="email">Email Address</label>
                <input type="email" id="email" class="crm-input" required placeholder="you@company.com">
            </div>
            <div style="margin-bottom:24px;">
                <label class="crm-label" for="password">Password</label>
                <input type="password" id="password" class="crm-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="crm-btn-primary" style="width:100%; padding:12px; font-size:14px;">Sign
                In</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:12px; color:#6b7280;">
            Don't have an account? <a href="register.html" class="small-link">Register</a>
        </div>
        <div id="error-msg" style="text-align:center; margin-top:16px; color:#ef4444; font-size:13px; display:none;">
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
