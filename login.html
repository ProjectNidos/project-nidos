<!DOCTYPE html>
<html lang="en">

<head>
    <script>history.scrollRestoration = 'manual';</script>    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Nidos CRM</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="crm.css?v=3">
</head>

<body style="display:flex; align-items:center; justify-content:center;">
    <div class="crm-shell" style="width:100%; max-width:400px; padding:40px;">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 class="crm-title" style="font-size:28px;">Welcome Back</h1>
            <div class="crm-subtitle">Sign in to access the CRM</div>
        </div>

        <form id="login-form">
            <div style="margin-bottom:16px;">
                <label class="crm-label" for="email">Login ID</label>
                <input type="text" id="email" class="crm-input" required placeholder="User ID">
            </div>
            <div style="margin-bottom:24px;">
                <label class="crm-label" for="password">Password</label>
                <input type="password" id="password" class="crm-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="crm-btn-primary" style="width:100%; padding:12px; font-size:14px;">Sign
                In</button>
        </form>

        <div id="error-msg" style="text-align:center; margin-top:16px; color:#ef4444; font-size:13px; display:none;">
        </div>
    </div>

    <script src="api.js?v=1"></script>
    <script src="auth.js?v=2"></script>
</body>

</html>
